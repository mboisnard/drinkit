[versions]
# Toolchain
jdk = "25"

# Tool Versions
squawk = "2.71.0"

# BOM Versions
cucumber-dependencies = "8.0.4"
opentelemetry-dependencies = "1.68.0"
spring-ai-dependencies = "2.0.2"
spring-boot-dependencies = "4.1.2"

# Runtime Versions
bouncycastle = "1.86"
bson = "5.14.0"
jooq = "3.21.9"
kotlin-logging = "8.0.6"
ksp = "2.3.13"
meilisearch = "0.22.1"
openfeature-sdk = "1.23.0"
openfeature-flipt-provider = "0.1.4"
springdoc-openapi = "3.2.0"

# Test Versions
approvaltests = "31.0.0"
rest-assured = "6.3.0"
konture = "1.0.4"
kotest = "6.2.6"
kotlin-faker = "1.16.2"
testcontainers-meilisearch = "2.0.0"


[libraries]
# BOM Dependencies
cucumber-dependencies-bom = { module = "io.cucumber:cucumber-bom", version.ref = "cucumber-dependencies" }
opentelemetry-dependencies-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry-dependencies" }
spring-ai-dependencies-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai-dependencies" }
spring-boot-dependencies-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot-dependencies" }

# Tool Binaries, one artifact per platform
squawk = { module = "sbdchd:squawk", version.ref = "squawk" }

# Runtime Dependencies
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
bson = { module = "org.mongodb:bson", version.ref = "bson" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-kotlin = { module = "org.jooq:jooq-kotlin", version.ref = "jooq" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
meilisearch-java-client = { module = "com.meilisearch.sdk:meilisearch-java", version.ref = "meilisearch" }
openfeature-sdk = { module = "dev.openfeature:sdk", version.ref = "openfeature-sdk" }
openfeature-flipt-provider = { module = "dev.openfeature.contrib.providers:flipt", version.ref = "openfeature-flipt-provider" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }

# Test Dependencies
approvaltests = { module = "com.approvaltests:approvaltests", version.ref = "approvaltests" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
konture = { module = "io.github.baole:konture", version.ref = "konture" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotlin-faker = { module = "io.github.serpro69:kotlin-faker", version.ref = "kotlin-faker" }
testcontainers-meilisearch = { module = "io.vanslog:testcontainers-meilisearch", version.ref = "testcontainers-meilisearch" }
