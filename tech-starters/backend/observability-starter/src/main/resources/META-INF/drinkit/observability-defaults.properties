# Each endpoint can be read, none can change the application, such as a logger level or a cache
management.endpoints.access.max-permitted=read-only
management.endpoints.web.exposure.include=health,info,metrics,loggers,caches,conditions

# Health is open to anonymous probes: its details, disk path and database included, are for admins only
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# A third party that is down, such as the search engine, leaves the application serving its other requests
management.endpoint.health.group.readiness.include=readinessState,db
# An application without a database starts all the same, ready as soon as it accepts traffic
management.endpoint.health.validate-group-membership=false

management.info.git.enabled=true
management.info.git.mode=full
management.info.build.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.process.enabled=true

# One span per security filter on every request, for no information of use
management.observations.enable.spring.security=false

# Read by the JSON formats only, which LOGGING_STRUCTURED_FORMAT_CONSOLE turns on outside a developer's machine
logging.structured.json.add.application=${spring.application.name}

# A caller from the internet would otherwise choose the traceId of its requests, and force their sampling
management.tracing.propagation.consume=
