management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # Health is open to anonymous probes: its details, disk path and database included, are for admins only
      show-details: when-authorized
      roles: ADMIN
  info:
    git:
      enabled: true
      mode: full
    build:
      enabled: true
    java:
      enabled: true