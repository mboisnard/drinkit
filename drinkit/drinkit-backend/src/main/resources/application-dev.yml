spring.docker.compose:
  life-cycle-management: start-only
  file: ${ROOT_FOLDER:}deployment/local/compose.yml
  skip.in-tests: true
  enabled: true
  # Compose runs on every start, even with the services up, so that the updater applies each new changelog. Within
  # 2 minutes: a lock left by a killed updater would otherwise hold the start for Liquibase's 5
  start:
    skip: never
    arguments: --wait-timeout=120

springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/drinkit
    username: drinkit
    password: admin
  # The Mailpit of the compose file, which asks for no authentication and offers no STARTTLS
  mail:
    host: localhost
    port: 1025
    properties.mail.smtp:
      auth: false
      starttls.enable: false

logging.level:
    org.springframework.security: DEBUG

starters:
  security:
    cookie:
      prefix: ""
      secure: false
  search-engine:
    meilisearch:
      api-key: masterKey
  feature-flags:
    flipt:
      url: http://localhost:8082
      namespace: default