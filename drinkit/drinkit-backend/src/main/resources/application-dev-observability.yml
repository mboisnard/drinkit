# Pushes the logs, the traces and the metrics to the OpenObserve of deployment/local/compose-observability.yml,
# started by hand:
#   ./gradlew :drinkit-backend:bootRun -Pspring.profiles.active=dev,dev-observability

starters:
  observability.opentelemetry.enabled: true
  # The messages of each call to a model, on its span
  ai.observations.include-content: true

management:
  tracing.sampling.probability: 1.0
  opentelemetry:
    resource-attributes:
      deployment.environment: local
    # Each signal adds its path, /v1/traces, /v1/logs or /v1/metrics
    otlp:
      endpoint: http://localhost:5080/api/default
      # Basic auth of its root user, root@drinkit.dev and Drinkit#2026
      headers.Authorization: Basic cm9vdEBkcmlua2l0LmRldjpEcmlua2l0IzIwMjY=
  otlp.metrics.export.step: 10s
