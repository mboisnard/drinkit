spring:
  application.name: drinkit
  threads.virtual.enabled: true

  http:
    serviceclient:
      exchangerate-api:
        base-url: https://v6.exchangerate-api.com/v6
      ecb:
        base-url: https://www.ecb.europa.eu

starters:
  security:
    code:
      max-email-length: 100 # MAX_EMAIL_LENGTH of the domain
  ai:
    endpoints:
      anthropic:
        provider: anthropic
        max-retries: 1
    models:
      claude-sonnet-5-5:
        endpoint: anthropic
  file-storage:
    usages:
      bottle-photo:
        types: [image/jpeg, image/png, image/webp]
        max-size: 5MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    context-path: /drinkit

springdoc:
  api-docs:
    path: /openapi/api-docs
    enabled: false
  swagger-ui:
    path: /openapi/ui
    enabled: false
  show-actuator: true