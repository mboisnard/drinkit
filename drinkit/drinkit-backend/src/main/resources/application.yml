spring:
  application.name: drinkit
  profiles:
    include: ocr
  threads.virtual.enabled: true

  http:
    serviceclient:
      exchangerate-api:
        base-url: https://v6.exchangerate-api.com/v6
      ecb:
        base-url: https://www.ecb.europa.eu

starters:
  security:
    code:
      max-email-length: 100 # MAX_EMAIL_LENGTH of the domain

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    context-path: /drinkit

springdoc:
  api-docs:
    path: /openapi/api-docs
    enabled: false
  swagger-ui:
    path: /openapi/ui
    enabled: false
  show-actuator: true