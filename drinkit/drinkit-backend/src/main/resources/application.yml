spring:
  application.name: drinkit
  profiles:
    include: security,postgresql,mail,monitoring,search-engine,ocr,webclient
  threads.virtual.enabled: true

  http:
    serviceclient:
      exchangerate-api:
        base-url: https://v6.exchangerate-api.com/v6
      ecb:
        base-url: https://www.ecb.europa.eu

server:
  port: ${PORT:8080}
  servlet:
    context-path: /drinkit

springdoc:
  api-docs:
    path: /openapi/api-docs
    enabled: false
  swagger-ui:
    path: /openapi/ui
    enabled: false
  show-actuator: true