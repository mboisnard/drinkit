openapi: 3.0.3
info:
  title: common components for auth api
  version: 1.0.0
  x-fragment: true
paths: {}
components:
  schemas:
    SignInRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          minLength: 2
          maxLength: 128
        rememberMe:
          type: boolean
          default: false
          description: Keeps the user signed in across browser restarts, through a remember-me cookie
