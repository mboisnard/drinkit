openapi: 3.0.3
info:
  title: common components for auth api
  version: 1.0.0
  x-fragment: true
paths: {}
components:
  schemas:
    SignInCodeRequest:
      type: object
      required:
        - email
      properties:
        email:
          $ref: '#/components/schemas/Email'

    SignInWithCodeRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
          example: '042137'
        rememberMe:
          type: boolean
          default: false
          description: Keeps the user signed in across browser restarts, through a remember-me cookie

    Email:
      type: string
      maxLength: 100
      pattern: '[^@ \t\r\n]+@[^@ \t\r\n]+\.[^@ \t\r\n]+'
      example: john.doe@gmail.com
