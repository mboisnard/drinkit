openapi: 3.0.3
info:
  title: Drink It API
  description: Drink It Apis for frontend/backend communication
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080/drinkit
    description: Dev server
security:
  - session: []
tags:
  - name: cellars
    description: Cellars operation
  - name: auth
    description: Authentication operations
  - name: registration
    description: User Registration operations
  - name: user
    description: User operations
  - name: search
    description: Search operations
  - name: sse
    description: Server-sent events
  - name: files
    description: Files uploaded by users, such as bottle photos
  - name: feature-management
    description: Feature flags and A/B test variants for clients, after ADR 017 and ADR 018

paths:
  /api/cellars:
    get:
      operationId: findCellars
      tags:
        - cellars
      summary: Find cellars
      description: |
        Returns all cellars you allow to see (owner or allowed from other users)
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: 'cellarsResponse.yaml#/components/schemas/CellarsResponse'
    post:
      operationId: createCellar
      tags:
        - cellars
      summary: Create a new cellar
      description: |
        Create a new cellar for the connected user
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'cellarsParameters.yaml#/components/schemas/CreateCellarRequest'
      security:
        - session: []
          xsrfToken: []
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '409':
          $ref: 'common.yaml#/components/responses/IdempotencyKeyInUse'
        '422':
          $ref: 'common.yaml#/components/responses/IdempotencyKeyReused'
        '413':
          $ref: 'common.yaml#/components/responses/IdempotentRequestTooLarge'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/CellarId'

  /api/cellars/{cellarId}:
    delete:
      operationId: deleteCellar
      tags:
        - cellars
      summary: Delete cellar by Id
      description: |
        Delete a cellar that you are the owner
      parameters:
        - $ref: 'cellarsParameters.yaml#/components/parameters/cellarId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      security:
        - session: []
          xsrfToken: []
      responses:
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/IdempotencyKeyInUse'
        '422':
          $ref: 'common.yaml#/components/responses/IdempotencyKeyReused'
        '413':
          $ref: 'common.yaml#/components/responses/IdempotentRequestTooLarge'
        '204':
          description: Cellar Deleted

  /api/auth/code:
    post:
      operationId: requestSignInCode
      tags:
        - auth
      summary: Send a sign-in code to an email
      description: |
        Served by the security starter, not by a controller. Sends a code of six digits to the email, valid for ten
        minutes, in place of any earlier code of that email. The email gets three wrong tries per hour, whatever code
        it holds. Answers the same, as fast, whether the email has an account or not: nothing is created until the
        code is entered. The requests are limited per email and per IP address: a limited one sends no email and
        keeps the live code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'authParameters.yaml#/components/schemas/SignInCodeRequest'
      security:
        - xsrfToken: []
      responses:
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '204':
          description: Code sent, when the email can receive it

  /api/auth/code/sign-in:
    post:
      operationId: signInWithCode
      tags:
        - auth
      summary: Sign in with the code sent by email
      description: |
        Served by the security starter, not by a controller. Signs in the account of the email, creates it when the
        email has none, or brings back an account deleted less than 30 days ago. Sets the session cookie, and the
        remember-me cookie when asked. Replaces the XSRF-TOKEN cookie in the same response, for the next unsafe
        request to send. The tries are limited per IP address, right ones included: past the limit, even a right code
        is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'authParameters.yaml#/components/schemas/SignInWithCodeRequest'
      security:
        - xsrfToken: []
      responses:
        '401':
          description: |
            Wrong, used or expired code, or an account that cannot sign in, with the same body for each: a problem
            detail of RFC 9457, as application/problem+json, with the traceId of the request.
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '204':
          description: User signed in

  /api/auth/logout:
    post:
      operationId: signOut
      tags:
        - auth
      summary: Sign the user out
      description: |
        Served by the security starter, not by a controller. Ends the session and its remember-me token, and expires
        their cookies and the XSRF-TOKEN cookie.
      security:
        - xsrfToken: []
      responses:
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '204':
          description: User signed out

  /api/auth/csrf:
    get:
      operationId: fetchCsrfToken
      tags:
        - auth
      summary: Get a CSRF token
      description: |
        Served by the security starter, not by a controller. Sets the XSRF-TOKEN cookie, whose value the client copies
        into the X-XSRF-TOKEN header of each unsafe request. Call it at start and after a sign out: a sign in sets a
        new one in its own response.
      security: []
      responses:
        '204':
          description: XSRF-TOKEN cookie set

  /webauthn/register/options:
    post:
      operationId: startPasskeyCreation
      tags:
        - auth
      summary: Get the options of a new passkey
      description: |
        Served by Spring Security's passkey support, in the security starter. The options of WebAuthn's
        navigator.credentials.create() for the signed-in user, whose challenge the session keeps until the passkey is
        saved. The passkey must be discoverable and verify the user. Answers 400, not 401, to a visitor who is not
        signed in.
      security:
        - xsrfToken: []
      responses:
        '400':
          description: The caller is not signed in
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '200':
          description: The options, to read with PublicKeyCredential.parseCreationOptionsFromJSON()
          content:
            application/json:
              schema:
                $ref: 'authParameters.yaml#/components/schemas/PasskeyCreationOptions'

  /webauthn/register:
    post:
      operationId: savePasskey
      tags:
        - auth
      summary: Save a new passkey
      description: |
        Served by Spring Security's passkey support, in the security starter. Checks the new passkey against the
        options the session keeps, then saves it under its label.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'authParameters.yaml#/components/schemas/PasskeyRegistration'
      security:
        - xsrfToken: []
      responses:
        '400':
          description: No options in the session, a body that is not a passkey, or a passkey refused, such as one from another origin
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '200':
          description: Passkey saved
          content:
            application/json:
              schema:
                $ref: 'authParameters.yaml#/components/schemas/PasskeySaved'

  /webauthn/register/{passkeyId}:
    delete:
      operationId: removePasskey
      tags:
        - auth
      summary: Remove a passkey of the user
      description: |
        Served by Spring Security's passkey support, in the security starter. The passkey signs in no more. The
        authenticator keeps it until the user removes it there, or the page tells it with the Signal API.
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema:
            $ref: 'authParameters.yaml#/components/schemas/PasskeyId'
      security:
        - xsrfToken: []
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          description: The passkey belongs to another user, or the XSRF token is missing
        '204':
          description: Passkey removed

  /webauthn/authenticate/options:
    post:
      operationId: startPasskeySignIn
      tags:
        - auth
      summary: Get the options of a passkey sign-in
      description: |
        Served by Spring Security's passkey support, in the security starter. The options of WebAuthn's
        navigator.credentials.get(), without any allowed passkey, so that the browser offers the passkeys of the site
        in the autofill of the email field. The session keeps their challenge until the sign-in.
      security:
        - xsrfToken: []
      responses:
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '200':
          description: The options, to read with PublicKeyCredential.parseRequestOptionsFromJSON()
          content:
            application/json:
              schema:
                $ref: 'authParameters.yaml#/components/schemas/PasskeyRequestOptions'

  /login/webauthn:
    post:
      operationId: signInWithPasskey
      tags:
        - auth
      summary: Sign in with a passkey
      description: |
        Served by Spring Security's passkey support, in the security starter. Checks the answer of the authenticator
        against the options the session keeps, then signs in the account of the passkey, as a sign-in by code does:
        a new session cookie, and a new XSRF-TOKEN cookie in the same response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'authParameters.yaml#/components/schemas/PasskeyAssertion'
      security:
        - xsrfToken: []
      responses:
        '401':
          description: Unknown or removed passkey, wrong origin or challenge, or a user the authenticator did not verify
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '200':
          description: User signed in
          content:
            application/json:
              schema:
                $ref: 'authParameters.yaml#/components/schemas/PasskeySignedIn'

  /api/files:
    post:
      operationId: uploadFile
      tags:
        - files
      summary: Upload a file for a usage, to keep it through a business route
      description: |
        Served by the file storage starter, not by a controller. Checks the file against its usage: its size, the type
        read from its bytes, its extension and its declared type. Stores it as temporary and answers its id, which a
        business route then keeps. A file not kept within 24 hours is deleted. The uploads are limited per user.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: 'files.yaml#/components/schemas/UploadFileRequest'
      security:
        - session: []
          xsrfToken: []
      responses:
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '413':
          description: |
            A file larger than its usage allows. The body is a problem detail of RFC 9457, as application/problem+json,
            with the traceId of the request.
        '415':
          description: |
            A file whose bytes are not a type of its usage, or whose extension or declared type does not match its
            bytes. The body is a problem detail of RFC 9457, as application/problem+json, with the traceId of the
            request.
        '429':
          description: |
            Too many uploads by this user: retry after the seconds of the Retry-After header. The body is a problem
            detail of RFC 9457, as application/problem+json, with the traceId of the request.
        '201':
          description: File stored, temporary until a business route keeps it
          content:
            application/json:
              schema:
                $ref: 'files.yaml#/components/schemas/UploadedFile'

  /sse/event-stream:
    get:
      operationId: openServerEventsStream
      tags:
        - sse
      summary: Open the server events stream of the signed-in user, or of the session of a visitor
      description: |
        Served by the SSE starter, not by a controller. Open it with the browser's EventSource, once per tab, not with
        the generated client. It carries the events sent to the signed-in user, or to the session the application
        opened for a visitor, each named by the application and with an id, and a comment line from time to time that
        keeps it open. It opens with an event named init, whose id is the one of the last event sent to that recipient:
        a tab whose last id differs missed an event. It closes after a few minutes, and EventSource opens it again. An
        event sent while the stream is closed is lost.
      security: []
      responses:
        '204':
          description: A visitor without a session, to whom no event can be sent. EventSource stops asking
        '200':
          description: The stream of the events
          content:
            text/event-stream:
              schema:
                type: string

  /ofrep/v1/evaluate/flags:
    post:
      operationId: evaluateFlags
      tags:
        - feature-management
      summary: Evaluate the flags and experiments a client asks for, for the signed-in user or the visitor
      description: |
        Served by the feature management starter, not by a controller, after the bulk evaluation of OFREP 0.4.0, so that
        the OFREP provider of an OpenFeature client reads it. The context names the keys the client asks for, and any
        other field of it is ignored: the backend evaluates for the signed-in user, or for the visitor of the security
        starter. An experiment the user was drawn into answers the reason SPLIT. It asks for the CSRF token like any POST.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'featureManagementParameters.yaml#/components/schemas/OfrepBulkEvaluationRequest'
      responses:
        '200':
          description: The flags and the variants, never kept by a shared cache
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: 'featureManagementParameters.yaml#/components/schemas/OfrepBulkEvaluationResponse'
        '304':
          description: Nothing changed since the ETag of If-None-Match
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'

  /experiments/{key}/exposures:
    post:
      operationId: reportExposure
      tags:
        - feature-management
      summary: Report that a client showed the variant of an experiment to the user or the visitor
      description: |
        Served by the feature management starter, not by a controller. The backend assigns the variant again, and
        records the exposure only when it matches the reported one.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            $ref: 'featureManagementParameters.yaml#/components/schemas/FeatureKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'featureManagementParameters.yaml#/components/schemas/ExposureReport'
      responses:
        '204':
          description: Recorded, or dropped when the variant differs from the assigned one
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'

  /api/registration/user/information:
    post:
      operationId: completeUserInformation
      tags:
        - registration
      summary: Complete user information
      description: |
        Complete required user information like firstname/lastname/...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'registrationParameters.yaml#/components/schemas/CompleteUserInformationRequest'
      security:
        - session: []
          xsrfToken: []
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '200':
          description: User information completed

  /api/user/me:
    get:
      operationId: getConnectedUserInfo
      tags:
        - user
      summary: Get connected user information
      description: |
        Get user information (roles, webpreferences, ...)
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: 'usersResponse.yaml#/components/schemas/ConnectedUserInformation'

  /api/user/me/locale:
    put:
      operationId: changeLocale
      tags:
        - user
      summary: Change the language of the account
      description: |
        Shows the pages without a language prefix, and writes the emails, in this language from now on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'usersParameters.yaml#/components/schemas/ChangeLocaleRequest'
      security:
        - session: []
          xsrfToken: []
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '204':
          description: Language changed, or already the one of the account

  /api/user/me/passkeys:
    get:
      operationId: listPasskeys
      tags:
        - user
      summary: List the passkeys of the user
      description: |
        The passkeys of the signed-in user, oldest first, each with the id that removes it. None while passkeys are
        off.
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '200':
          description: The passkeys of the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'authParameters.yaml#/components/schemas/Passkey'

  /api/search/upload:
    post:
      operationId: searchByPhotoUpload
      tags:
        - search
      summary: Search bottle using a photo
      description: |
        Search bottle using a photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
        - session: []
          xsrfToken: []
      responses:
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '413':
          description: |
            A file larger than the upload limit. The body is a problem detail of RFC 9457, as application/problem+json,
            with the traceId of the request.
        '200':
          description: Success

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        The session cookie, set at sign in. Named `__Host-SESSION` outside the dev profile.
    xsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        The raw value of the XSRF-TOKEN cookie, which `GET /api/auth/csrf` sets, required by each unsafe request
        along with that cookie. The cookie is named `__Host-XSRF-TOKEN` outside the dev profile.
