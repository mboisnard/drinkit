openapi: 3.0.3
info:
  title: Drink It API
  description: Drink It Apis for frontend/backend communication
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080/drinkit
    description: Dev server
security:
  - session: []
tags:
  - name: cellars
    description: Cellars operation
  - name: auth
    description: Authentication operations
  - name: registration
    description: User Registration operations
  - name: user
    description: User operations
  - name: search
    description: Search operations
  - name: sse
    description: Server-sent events

paths:
  /api/cellars:
    get:
      operationId: findCellars
      tags:
        - cellars
      summary: Find cellars
      description: |
        Returns all cellars you allow to see (owner or allowed from other users)
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: 'cellarsResponse.yaml#/components/schemas/CellarsResponse'
    post:
      operationId: createCellar
      tags:
        - cellars
      summary: Create a new cellar
      description: |
        Create a new cellar for the connected user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'cellarsParameters.yaml#/components/schemas/CreateCellarRequest'
      security:
        - session: []
          xsrfToken: []
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '400':
          description: Bad Request (maybe wrong object validation)
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/CellarId'

  /api/cellars/{cellarId}:
    delete:
      operationId: deleteCellar
      tags:
        - cellars
      summary: Delete cellar by Id
      description: |
        Delete a cellar that you are the owner
      parameters:
        - $ref: 'cellarsParameters.yaml#/components/parameters/cellarId'
      security:
        - session: []
          xsrfToken: []
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          description: No cellar of the connected user has this id
        '204':
          description: Cellar Deleted

  /api/auth/code:
    post:
      operationId: requestSignInCode
      tags:
        - auth
      summary: Send a sign-in code to an email
      description: |
        Served by the security starter, not by a controller. Sends a code of six digits to the email, valid for ten
        minutes, in place of any earlier code of that email. The email gets three wrong tries per hour, whatever code
        it holds. Answers the same, as fast, whether the email has an account or not: nothing is created until the
        code is entered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'authParameters.yaml#/components/schemas/SignInCodeRequest'
      security:
        - xsrfToken: []
      responses:
        '400':
          description: No email in the body
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '204':
          description: Code sent, when the email can receive it

  /api/auth/code/sign-in:
    post:
      operationId: signInWithCode
      tags:
        - auth
      summary: Sign in with the code sent by email
      description: |
        Served by the security starter, not by a controller. Signs in the account of the email, creates it when the
        email has none, or brings back an account deleted less than 30 days ago. Sets the session cookie, and the
        remember-me cookie when asked. Replaces the XSRF-TOKEN cookie in the same response, for the next unsafe
        request to send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'authParameters.yaml#/components/schemas/SignInWithCodeRequest'
      security:
        - xsrfToken: []
      responses:
        '401':
          description: |
            Wrong, used or expired code, or an account that cannot sign in, with the same body for each: a problem
            detail of RFC 9457, as application/problem+json.
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '204':
          description: User signed in

  /api/auth/logout:
    post:
      operationId: signOut
      tags:
        - auth
      summary: Sign the user out
      description: |
        Served by the security starter, not by a controller. Ends the session and its remember-me token, and expires
        their cookies and the XSRF-TOKEN cookie.
      security:
        - xsrfToken: []
      responses:
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '204':
          description: User signed out

  /api/auth/csrf:
    get:
      operationId: fetchCsrfToken
      tags:
        - auth
      summary: Get a CSRF token
      description: |
        Served by the security starter, not by a controller. Sets the XSRF-TOKEN cookie, whose value the client copies
        into the X-XSRF-TOKEN header of each unsafe request. Call it at start and after a sign out: a sign in sets a
        new one in its own response.
      security: []
      responses:
        '204':
          description: XSRF-TOKEN cookie set

  /sse/event-stream:
    get:
      operationId: openServerEventsStream
      tags:
        - sse
      summary: Open the server events stream of the signed-in user, or of the session of a visitor
      description: |
        Served by the SSE starter, not by a controller. Open it with the browser's EventSource, once per tab, not with
        the generated client. It carries the events sent to the signed-in user, or to the session the application
        opened for a visitor, each named by the application, and a comment line from time to time that keeps it open.
        It closes after a few minutes, and EventSource opens it again. An event sent while the stream is closed is lost.
      security: []
      responses:
        '204':
          description: A visitor without a session, to whom no event can be sent. EventSource stops asking
        '200':
          description: The stream of the events
          content:
            text/event-stream:
              schema:
                type: string

  /api/registration/user/information:
    post:
      operationId: completeUserInformation
      tags:
        - registration
      summary: Complete user information
      description: |
        Complete required user information like firstname/lastname/...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'registrationParameters.yaml#/components/schemas/CompleteUserInformationRequest'
      security:
        - session: []
          xsrfToken: []
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '400':
          description: Bad request
        '200':
          description: User information completed

  /api/user/me:
    get:
      operationId: getConnectedUserInfo
      tags:
        - user
      summary: Get connected user information
      description: |
        Get user information (roles, webpreferences, ...)
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          description: The connected user was deleted since signing in
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: 'usersResponse.yaml#/components/schemas/ConnectedUserInformation'

  /api/search/upload:
    post:
      operationId: searchByPhotoUpload
      tags:
        - search
      summary: Search bottle using a photo
      description: |
        Search bottle using a photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
        - session: []
          xsrfToken: []
      responses:
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '200':
          description: Success

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        The session cookie, set at sign in. Named `__Host-SESSION` outside the dev profile.
    xsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        The raw value of the XSRF-TOKEN cookie, which `GET /api/auth/csrf` sets, required by each unsafe request
        along with that cookie. The cookie is named `__Host-XSRF-TOKEN` outside the dev profile.
