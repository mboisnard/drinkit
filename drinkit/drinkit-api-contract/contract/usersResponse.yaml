openapi: 3.0.3
info:
  title: common components for user api
  version: 1.0.0
  x-fragment: true
paths: {}
components:
  schemas:
    ConnectedUserInformation:
      type: object
      required:
        - roles
        - locale
      properties:
        locale:
          type: string
          description: The language of the account, as an ISO 639 code such as fr, which the pages without a language prefix show
          minLength: 2
          maxLength: 3
          pattern: '^[a-z]{2,3}$'
          example: fr
        firstname:
          type: string
        lastname:
          type: string
        birthdate:
          type: string
          format: date
        roles:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Role'

    Role:
      type: string
      enum:
        - ROLE_ADMIN
        - ROLE_USER
        - ROLE_REGISTRATION_IN_PROGRESS