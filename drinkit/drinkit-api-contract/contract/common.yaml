openapi: 3.0.3
info:
  title: common components for all apis
  version: 1.0.0
  x-fragment: true
paths: {}
components:
  schemas:
    CityLocation:
      type: object
      required:
        - city
        - country
        - point
      properties:
        city:
          type: string
          example: Paris
        country:
          $ref: '#/components/schemas/Country'
        point:
          $ref: '#/components/schemas/Point'

    Country:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          example: France
        code:
          type: string
          minLength: 2
          maxLength: 2
          example: FR

    Point:
      type: object
      required:
        - longitude
        - latitude
      properties:
        longitude:
          type: number
          minimum: -180.0
          maximum: 180.0
          example: 2.3488
        latitude:
          type: number
          minimum: -90.0
          maximum: 90.0
          example: 48.853

    CellarId:
      type: string
      format: cellar-id
      example: 659ee3164b1d53340c4f7608

    UserId:
      type: string
      format: user-id
      example: 659ee3164b1d53340c4f7608

  # No content: the security filters write these bodies, and a content type here would join the produces of each
  # generated mapping, refusing a request that accepts application/json only
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A key the client draws once per action, a UUID for instance, and sends again on each retry of that action: a
        retry then gets the answer of the first request, and the action runs once. Kept 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: 8e03978e-40d5-43e8-bc93-6894a57f9324

  responses:
    IdempotencyKeyInUse:
      description: |
        A request with this Idempotency-Key still runs: retry after the seconds of the Retry-After header. The body is
        a problem detail of RFC 9457, as application/problem+json.

    IdempotencyKeyReused:
      description: |
        This Idempotency-Key was sent with another request. The body is a problem detail of RFC 9457, as
        application/problem+json.

    IdempotentRequestTooLarge:
      description: |
        A request with an Idempotency-Key carries a body of at most 64 KB. The body is a problem detail of RFC 9457, as
        application/problem+json.

    TooManyRequests:
      description: |
        Too many calls for this email or from this IP address: retry after the seconds of the Retry-After header. The
        body is a problem detail of RFC 9457, as application/problem+json, the same for any email.

    BadRequest:
      description: |
        The request breaks the contract or a rule of the operation. The body is a problem detail of RFC 9457, as
        application/problem+json, with the traceId of the request.

    NotFound:
      description: |
        Nothing the connected user can reach has this id. The body is a problem detail of RFC 9457, as
        application/problem+json, with the traceId of the request.

    Unauthorized:
      description: |
        No user is signed in. The body is a problem detail of RFC 9457, as application/problem+json, with the traceId of
        the request.

    Forbidden:
      description: |
        Refused: the X-XSRF-TOKEN header is missing or wrong, the request comes from another site, or the user lacks
        the role. The body is a problem detail of RFC 9457, as application/problem+json, with the traceId of the request.
