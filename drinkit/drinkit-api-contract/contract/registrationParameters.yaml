openapi: 3.0.3
info:
  title: common components for registration api
  version: 1.0.0
  x-fragment: true
paths: {}
components:
  schemas:
    CompleteUserInformationRequest:
      type: object
      required:
        - firstname
        - lastname
        - birthdate
      properties:
        firstname:
          type: string
          minLength: 2
          maxLength: 100
          example: John
        lastname:
          type: string
          minLength: 2
          maxLength: 100
          example: Doe
        birthdate:
          type: string
          format: date
          example: '1990-12-01'
