packages:
  - code-analysis/eslint
  - code-analysis/stylelint
  - drinkit/*-frontend
  - tech-starters/frontend/*
  - docs
  - .hooks

# Every dependency names its version here once, as `catalog:` in its package.json
catalogMode: strict

# Supply chain: a release waits 7 days before it can be installed, as Renovate waits for its pull requests
minimumReleaseAge: 10080

# A dependency runs its install script only when listed true here
allowBuilds:
  better-sqlite3: true # the database Nuxt Content builds the documentation site from
  esbuild: true
  vue-demi: false # picks Vue 2 or 3, and defaults to Vue 3 without its script

# A transitive version replaced until its parent ships the fix: remove the line once it does
overrides:
  '@hey-api/json-schema-ref-parser>js-yaml': 'catalog:' # 1.4.4 pins js-yaml 4.2.0, which has GHSA-2883-xcg3-v3hh

catalog:
