packages:
  - code-analysis/eslint
  - code-analysis/stylelint
  - drinkit/*-frontend
  - tech-starters/frontend/*
  - docs
  - .hooks

# Every dependency names its version here once, as `catalog:` in its package.json
catalogMode: strict

# Supply chain: a release waits 7 days before it can be installed, as Renovate waits for its pull requests
minimumReleaseAge: 10080

# A dependency runs its install script only when listed true here
allowBuilds:
  better-sqlite3: true # the database Nuxt Content builds the documentation site from
  esbuild: true
  vue-demi: false # picks Vue 2 or 3, and defaults to Vue 3 without its script

catalog:
  '@barzhsieh/nuxt-content-mermaid': 4.0.1
  '@eslint-community/eslint-plugin-eslint-comments': 4.8.1
  '@nuxt/content': 3.16.2
  '@nuxt/eslint-config': 1.17.0
  '@nuxtjs/i18n': 10.6.0
  '@stylistic/stylelint-config': 6.1.0
  '@types/estree': 1.0.10
  '@types/node': 26.6.6
  '@vitest/eslint-plugin': 1.6.28
  bats: 1.13.0
  bats-assert: 2.2.4
  bats-support: 0.3.0
  docus: 5.15.0
  eslint: 10.14.0
  eslint-plugin-check-file: 3.3.2
  eslint-plugin-compat: 7.0.2
  eslint-plugin-playwright: 2.12.2
  nuxt: 4.6.4
  nuxt-security: 2.7.0
  postcss: 8.5.32
  postcss-html: 2.0.0
  scule: 1.3.0
  stylelint: 18.0.0
  typescript: 6.0.3
  typescript-eslint: 8.72.2
  vitest: 5.1.0
  vue: 3.5.45
  vue-eslint-parser: 10.4.2
  vue-router: 5.5.0
  vue-tsc: 3.3.14
