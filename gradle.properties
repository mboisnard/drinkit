org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# A long-lived daemon keeps the class loaders of every build it ran; the test suite followed by
# detekt's type resolution overruns the 384m metaspace default. Heap is not the problem.
org.gradle.jvmargs=-XX:MaxMetaspaceSize=1g
