volumes:
  postgresql-data:
  meilisearch-data:
  flipt-data:

services:
  postgresql:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: drinkit
      POSTGRES_USER: drinkit
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "drinkit", "-d", "drinkit"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      # Probes every second until healthy: without it, Docker Engine 25+ waits 5 s before the first probe
      start_interval: 1s

  # Applies the changelogs of deployment/updater, then its demo data, each time compose starts. Local only: a
  # deployment runs the default changelog, never the demo one, whose admin anyone reading the local emails can sign in as
  updater:
    image: ghcr.io/mboisnard/drinkit-updater:latest@sha256:839cfa2acbb037f42d0c03b9da897ffd67b0dddcc03d057edcec948c43cc4a56
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ../updater/src/main/resources/db:/workspace/db:ro,z
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/drinkit
      SPRING_DATASOURCE_USERNAME: drinkit
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-demo.yml
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # `up --wait` counts the running updater as ready and returns before it ends: this service starts only once the
  # updater succeeded, so that compose, and the backend after it, wait for the changelogs
  updater-done:
    image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
    depends_on:
      updater:
        condition: service_completed_successfully

  meilisearch:
    image: getmeili/meilisearch:v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: true
      MEILI_UPGRADE_DB: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_DISABLE_VERSION_CHECK: true
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  flipt:
    image: flipt/flipt:v2.14.1@sha256:fb8087a8819ae06a4ca84aaa7ab31bb4acb65006a38f4cc04c30fdf16e4e2630
    ports:
      - "8082:8080"
    volumes:
      - flipt-data:/var/opt/flipt # TODO change to real path
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
