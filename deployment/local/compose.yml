volumes:
  postgresql-data:
  meilisearch-data:
  flipt-data:
  localai-models:
  localai-backends:

services:
  postgresql:
    image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: drinkit
      POSTGRES_USER: drinkit
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "drinkit", "-d", "drinkit"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      # Probes every second until healthy: without it, Docker Engine 25+ waits 5 s before the first probe
      start_interval: 1s

  # Applies the changelogs of deployment/updater, then its demo data, each time compose starts. Local only: a
  # deployment runs the default changelog, never the demo one, whose admin anyone reading the local emails can sign in as
  updater:
    image: ghcr.io/mboisnard/drinkit-updater:latest@sha256:76051f024f17483b791311424c79ce24294443bd840f7a4c8db2e5db8a6ec4cb
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ../updater/src/main/resources/db:/workspace/db:ro,z
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/drinkit
      SPRING_DATASOURCE_USERNAME: drinkit
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-demo.yml
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # `up --wait` counts the running updater as ready and returns before it ends: this service starts only once the
  # updater succeeded, so that compose, and the backend after it, wait for the changelogs
  updater-done:
    image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
    depends_on:
      updater:
        condition: service_completed_successfully

  meilisearch:
    image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: true
      MEILI_UPGRADE_DB: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_DISABLE_VERSION_CHECK: true
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  flipt:
    image: flipt/flipt:v2.14.1@sha256:fb8087a8819ae06a4ca84aaa7ab31bb4acb65006a38f4cc04c30fdf16e4e2630
    ports:
      - "8082:8080"
    volumes:
      - ./flipt/config.yml:/etc/flipt/config/default.yml:ro
      - flipt-data:/var/opt/flipt
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # Serves the vision and the embedding models of ai-starter. Its first start downloads them, about 3.9 GB, and its
  # llama.cpp backend before it listens. Neither compose nor the readiness check of Spring Boot waits for it, so the
  # application starts meanwhile: until it answers, ai-starter moves on to the next model
  localai:
    image: localai/localai:v4.12.1@sha256:c8556c4f7b6dd9b76e915d515ab5cfe5a765d8ea8fd3f0cf563f9c690b48a7f4
    command: ["qwen3-vl-4b-instruct", "qwen3-embedding-0.6b"]
    ports:
      - "8083:8080"
    volumes:
      - localai-models:/models
      - localai-backends:/backends
    healthcheck:
      disable: true
    labels:
      org.springframework.boot.readiness-check.tcp.disable: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
