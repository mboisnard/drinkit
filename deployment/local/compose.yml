volumes:
  postgresql-data:
  meilisearch-data:
  flipt-data:
  localai-models:
  localai-backends:

services:
  postgresql:
    image: postgres:19.0@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: drinkit
      POSTGRES_USER: drinkit
      POSTGRES_PASSWORD: admin
    # Without it, Spring Boot connects the backend as POSTGRES_USER, the owner, whatever its datasource says
    labels:
      org.springframework.boot.ignore: true
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "drinkit", "-d", "drinkit"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      # Probes every second until healthy: without it, Docker Engine 25+ waits 5 s before the first probe
      start_interval: 1s

  # Applies the changelogs of deployment/updater, then its demo data, each time compose starts. Local only: a
  # deployment runs the default changelog, never the demo one, whose admin anyone reading the local emails can sign in as
  updater:
    image: ghcr.io/mboisnard/drinkit-updater:latest@sha256:cfab5c90c5696a8809ff08c573a212fd6a730b932fd4ac265de545dd40003f8f
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ../updater/src/main/resources/db:/workspace/db:ro,z
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/drinkit
      SPRING_DATASOURCE_USERNAME: drinkit
      SPRING_DATASOURCE_PASSWORD: admin
      DRINKIT_BACKEND_PASSWORD: drinkit-pwd
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-demo.yml
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # `up --wait` counts the running updater as ready and returns before it ends: this service starts only once the
  # updater succeeded, so that compose, and the backend after it, wait for the changelogs
  updater-done:
    image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
    depends_on:
      updater:
        condition: service_completed_successfully

  meilisearch:
    image: getmeili/meilisearch:v1.57.0@sha256:91bf09897482c17205c8faeca8daa8d57999fb9de20d862763cdfa92ba4ec790
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: true
      MEILI_UPGRADE_DB: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_DISABLE_VERSION_CHECK: true
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  flipt:
    image: flipt/flipt:v2.14.2@sha256:121830e237c3a0d2b875f73905944d6ff301fdd7881c5abdec5f24f5549537e8
    ports:
      - "8082:8080"
    volumes:
      - ./flipt/config.yml:/etc/flipt/config/default.yml:ro
      - flipt-data:/var/opt/flipt
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # Serves the vision and the embedding models of ai-starter. Its first start downloads them, about 3.9 GB, and its
  # llama.cpp backend before it listens. Neither compose nor the readiness check of Spring Boot waits for it, so the
  # application starts meanwhile: until it answers, ai-starter moves on to the next model
  localai:
    image: localai/localai:v5.0.1@sha256:7240f75f2b7f00eeb4e77ff2921c25f77ab265b4e5888933e702e0c3b49d876d
    command: ["qwen3-vl-4b-instruct", "qwen3-embedding-0.6b"]
    ports:
      - "8083:8080"
    volumes:
      - localai-models:/models
      - localai-backends:/backends
    healthcheck:
      disable: true
    labels:
      org.springframework.boot.readiness-check.tcp.disable: true
    cap_drop:
      - ALL
    # The entrypoint starts as root to hand the volumes over to uid 10001, then runs LocalAI as that user
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
