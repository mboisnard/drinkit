# OpenObserve, which stores and shows the logs, the traces and the metrics that the backend pushes over OTLP with its
# dev-observability profile. Started by hand, apart from the services of the dev profile:
#   docker compose -f deployment/local/compose-observability.yml up --detach
# UI on http://localhost:5080, as root@drinkit.dev and Drinkit#2026
# A project of its own: under the folder's name, local, each file would take the other's containers for orphans
name: drinkit-observability

volumes:
  openobserve-data:

services:
  openobserve:
    image: openobserve/openobserve:v1.2.0@sha256:896361d533cac56ef346d940b1ddd6664e04d5f9606bd80b4a2e28069a33020e
    ports:
      - "5080:5080"
    volumes:
      - openobserve-data:/data
    environment:
      ZO_DATA_DIR: /data
      # Read at the first start only, when the volume is empty
      ZO_ROOT_USER_EMAIL: root@drinkit.dev
      ZO_ROOT_USER_PASSWORD: "Drinkit#2026"
      ZO_TELEMETRY: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
