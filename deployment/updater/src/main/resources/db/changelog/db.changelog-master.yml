# endsWithFilter exists since Liquibase 4.24: the IDE warns because SchemaStore maps this file to a Liquibase 3.2 schema
databaseChangeLog:
  - includeAll:
      path: classpath:/db/changelog/base/
      endsWithFilter: .sql
  - includeAll:
      path: classpath:/db/changelog/ddl/
      endsWithFilter: .sql
      errorIfMissingOrEmpty: false
  - includeAll:
      path: classpath:/db/changelog/dml/
      endsWithFilter: .sql
      errorIfMissingOrEmpty: false
