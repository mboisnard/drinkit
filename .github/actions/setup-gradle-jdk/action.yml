name: Set up JDK and Gradle
description: The JDK and Gradle setup every Gradle job of the CI shares

inputs:
  cache-read-only:
    description: Restore the Gradle cache without saving it. Only the backend job saves it, on master
    default: 'true'
  cache-encryption-key:
    description: Lets setup-gradle keep the configuration cache between runs. Empty on fork pull requests
    default: ''

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: 25

    # Also checks the Gradle wrapper against the official releases, so no separate workflow does it
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
