name: Bug
description: Something does not work as it should
labels:
  - bug
projects:
  - mboisnard/2
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, with the error message or a screenshot if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1. Start the backend with `./gradlew :drinkit-backend:bootRun`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit you ran, from `git rev-parse --short HEAD`.
