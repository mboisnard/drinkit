name: Publish the updater image

on:
  workflow_call:

env:
  IMAGE: ghcr.io/mboisnard/drinkit-updater

# Build once, test that exact image, then publish it. Only the last job holds a package token, and it pushes the
# tested archive as it is, so nothing it runs builds or checks the image
jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      checksum: ${{ steps.digest.outputs.checksum }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The published bytes come from the commit, never from a cache that other jobs of master write
      - name: Set up JDK and Gradle
        uses: $/.github/actions/setup-gradle-jdk
        with:
          cache-disabled: 'true'

      - name: Build the jar and its layers
        run: ./gradlew :updater:extractLayers

      # The builder of the runner cannot write an image of two platforms. BuildKit is pinned like every tool
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      # Reproducible, so an unchanged image keeps its digest. An archive, pushed only once tested
      - name: Build both platforms into an archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: deployment/updater/build/image
          file: deployment/updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=oci,dest=${{ runner.temp }}/updater.tar,rewrite-timestamp=true

      # Any step of the run could replace the artifact, so the next jobs check its bytes against this checksum
      - name: Read its digest and its checksum
        id: digest
        run: |
          echo "digest=$(tar --extract --to-stdout --file "$RUNNER_TEMP/updater.tar" index.json | jq -r '.manifests[0].digest')" >> "$GITHUB_OUTPUT"
          echo "checksum=$(sha256sum "$RUNNER_TEMP/updater.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Compare it with latest
        id: compare
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Empty before the first publication
          latest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest || true)
          echo "latest: ${latest:-none}, this commit: $DIGEST"
          echo "changed=$([ "$latest" != "$DIGEST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Keep the image
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-image
          path: ${{ runner.temp }}/updater.tar
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test the image on ${{ matrix.arch }}
    needs: build
    if: needs.build.outputs.changed == 'true'
    # Each platform runs on a runner of its own CPU, so the arm64 image that Macs pull runs too
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater-image
          path: ${{ runner.temp }}

      # skopeo comes with the runner image, the arm64 one included; installed only if a runner lacks it
      - name: Load the image of this platform
        env:
          ARCH: ${{ matrix.arch }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
        run: |
          sha256sum --check <<< "$CHECKSUM  $RUNNER_TEMP/updater.tar"
          command -v skopeo > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          skopeo copy --override-arch "$ARCH" "oci-archive:$RUNNER_TEMP/updater.tar" docker-daemon:drinkit-updater:test

      - name: Smoke-test the image
        uses: $/.github/actions/updater-smoke
        with:
          image: drinkit-updater:test

      - name: Scan the image
        uses: docker://aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        with:
          args: image --image-src docker --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 drinkit-updater:test

  publish:
    name: Publish the tested image
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Get the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater-image
          path: ${{ runner.temp }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: false

      # The archive must be the bytes built and tested, and --preserve-digests keeps their digest in the registry
      - name: Push it under its commit
        env:
          CHECKSUM: ${{ needs.build.outputs.checksum }}
        run: |
          sha256sum --check <<< "$CHECKSUM  $RUNNER_TEMP/updater.tar"
          command -v skopeo > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/updater.tar" "docker://$IMAGE:$GITHUB_SHA"

      # `gh attestation verify oci://<image>@<digest> --owner mboisnard` checks it
      - name: Attest the provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          create-storage-record: false

      # A run that finishes late never moves `latest` back over an image a newer commit of master published
      - name: Tag it latest, unless a newer commit published its image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newer=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...master" --jq '[.commits[].sha]')
          tags=$(skopeo list-tags "docker://$IMAGE")
          if jq -e --argjson newer "$newer" '.Tags | any(IN($newer[]))' <<< "$tags" > /dev/null; then
            echo "::notice::a newer commit of master already published its image"
            exit 0
          fi
          skopeo copy --all --preserve-digests "docker://$IMAGE@$DIGEST" "docker://$IMAGE:latest"

      # Last, so that no post step of an action runs while the token is on disk
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
