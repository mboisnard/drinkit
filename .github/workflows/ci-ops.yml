name: Ops

on:
  workflow_call:

jobs:
  compose:
    name: Validate the compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate the local compose file
        run: docker compose -f deployment/local/compose.yml config --quiet
