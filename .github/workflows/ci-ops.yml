name: Ops

on:
  workflow_call:

jobs:
  compose:
    name: Validate and start the compose services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      COMPOSE_FILE: deployment/local/compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the local compose file
        run: docker compose config --quiet

      # Renovate merges a new image digest on its own: it must exist and start
      - name: Pull the images
        run: docker compose pull

      - name: Start the services and wait until they are healthy
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Show the services
        if: success() || failure()
        run: docker compose ps --all

      - name: Show the logs of the services
        if: failure()
        run: docker compose logs --no-color
