name: Ops

on:
  workflow_call:

jobs:
  compose:
    name: Validate the compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate the local compose file
        run: docker compose -f deployment/local/compose.yml config --quiet
