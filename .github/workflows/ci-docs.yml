name: Docs

on:
  workflow_call:

jobs:
  build:
    name: Generate and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Each page shows the day of its last commit, which a shallow clone would set to the last commit of all
          fetch-depth: 0

      - name: Set up JDK and Gradle
        uses: $/.github/actions/setup-gradle-jdk

      # The processor writes its pages outside the task outputs, so a cache hit would leave them out.
      # --rerun forces the kspKotlin tasks only, what they need still comes from the cache
      - name: Generate the living documentation
        run: ./gradlew kspKotlin --rerun

      # The site and the lint rules of code-analysis it runs
      - name: Set up pnpm and install
        uses: $/.github/actions/setup-pnpm
        with:
          filter: '{docs}...'

      - name: Build the site
        working-directory: docs
        run: pnpm build

      - name: Keep the site for the deployment
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.output/public
          # The skills index lives under .well-known/, which the upload leaves out by default
          include-hidden-files: true
