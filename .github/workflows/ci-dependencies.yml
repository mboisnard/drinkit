name: Dependencies

on:
  workflow_call:

jobs:
  submission:
    name: Submit the dependency graph
    # On a pull request the branch's build runs with a write token: never for forks, which get none
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # The key GitHub replaces on each submission, derived from the former workflow and job names.
      # A new key would leave the previous graph on GitHub for good
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: dependency_submission-dependency-submission
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: $/.github/actions/setup-gradle-jdk

      - name: Generate and submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # A build that reuses the configuration cache writes no graph, and the run still passes
          additional-arguments: --no-configuration-cache

  review:
    name: Review the added dependencies
    needs: submission
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review the added dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # A build tool of the frontend, a devDependency, still shapes what is served
          fail-on-scopes: runtime, development
          # Advisories with no fix in the build tools of the documentation site, which ships static files only.
          # Remove each one once Docus or Nuxt Content moves past it
          allow-ghsas: GHSA-mrhx-c7xc-m3w5, GHSA-g3hv-75wg-m249, GHSA-3g3m-2fjr-6pw4, GHSA-g7r4-m6w7-qqqr, GHSA-238p-pmpm-9mq7
          # The base commit's snapshot comes from its own master run, which may still be going
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
