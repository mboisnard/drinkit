name: Build DrinkIt backend projects

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'drinkit/drinkit-frontend/**'
      - 'tech-starters/frontend/**'
      - 'docs/**'
  # No path filter: build is a required check of the master ruleset, and a filtered-out check never reports
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Upload Failing tests reports to GitHub Actions Artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report
          path: drinkit/**/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 1