name: Execute code analysis

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  detekt-static-code-analysis:
    name: Detekt - Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # detektAll is the same entry point developers use, and it reaches the Gradle scripts, which
      # the explicit task list did not. detektReportMergeSarif merges the per-project reports into
      # the single file uploaded below.
      - name: Run Detekt
        run: ./gradlew detektAll detektReportMergeSarif --continue

      - name: Upload SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: success() || failure()
        with:
          sarif_file: build/reports/detekt/detekt-all-projects.sarif
          category: detekt-code-analysis

  codeql-static-code-analysis:
    name: CodeQL - Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # CodeQL only extracts what it sees being compiled: a reused daemon or a build cache hit would hide
      # the compilation and leave the database empty
      - name: Build Application
        run: ./gradlew classes --no-daemon --no-build-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: codeql-security-analysis
