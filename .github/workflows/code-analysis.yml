name: Execute code analysis

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  detekt-static-code-analysis:
    name: Detekt - Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # detektAll is the same entry point developers use, and it reaches the Gradle scripts, which
      # the explicit task list did not. detektReportMergeSarif merges the per-project reports into
      # the single file uploaded below.
      - name: Run Detekt
        run: ./gradlew detektAll detektReportMergeSarif --continue

      - name: Upload SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: build/reports/detekt/detekt-all-projects.sarif
          category: detekt-code-analysis

