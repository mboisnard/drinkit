name: Frontend

on:
  workflow_call:

jobs:
  check:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The Nuxt apps and the packages they depend on, the frontend tech starters among them
      APPS: "{drinkit/*-frontend}..."
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and install
        uses: $/.github/actions/setup-pnpm
        with:
          filter: ${{ env.APPS }}

      - name: Lint
        run: pnpm --recursive --filter "$APPS" lint

      - name: Type check
        run: pnpm --recursive --filter "$APPS" typecheck

      - name: Test
        run: pnpm --recursive --filter "$APPS" test

      - name: Build
        run: pnpm --recursive --filter "$APPS" build
