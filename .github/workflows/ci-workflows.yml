name: CI files

on:
  workflow_call:

jobs:
  lint:
    name: Lint the workflows with actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A maintained fork: actionlint itself has had no release since March 2026 and rejects `$/`.
      # Should the fork stop, rhysd/actionlint still runs with -ignore '"\$/', without checking the `$/` calls
      - name: Lint the workflows
        uses: docker://ghcr.io/kjanat/actionlint:1.17.1@sha256:c0a63b3e5c974c2466ead39404b70e448176beaff8c5ec7af0b2e96191aea661

  audit:
    name: Audit the workflows with zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Uploading to code scanning would never fail the job, and the gate only sees failures
          advanced-security: false
          annotations: true
