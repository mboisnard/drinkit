name: CI files

on:
  workflow_call:

jobs:
  lint:
    name: Lint the workflows with actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A maintained fork: actionlint itself has had no release since March 2026 and rejects `$/`.
      # Should the fork stop, rhysd/actionlint still runs with -ignore '"\$/', without checking the `$/` calls
      - name: Lint the workflows
        uses: docker://ghcr.io/kjanat/actionlint:1.17.0@sha256:d484cccadf56b6a356466ade9af4c8e05c5dce1badaf0a9ecd0d7639d68d9c92

  audit:
    name: Audit the workflows with zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Uploading to code scanning would never fail the job, and the gate only sees failures
          advanced-security: false
          annotations: true
