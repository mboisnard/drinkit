name: Dependency Submission

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  # The workflow name and this job id form the snapshot correlator: renaming either leaves the previous graph on GitHub
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25

      - name: Generate and submit the dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # A build that reuses the configuration cache writes no graph, and the run still passes
          additional-arguments: --no-configuration-cache
