name: Dependency Submission

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  # The workflow name and this job id form the snapshot correlator: renaming either leaves the previous graph on GitHub
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Generate and submit the dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          # A build that reuses the configuration cache writes no graph, and the run still passes
          additional-arguments: --no-configuration-cache
