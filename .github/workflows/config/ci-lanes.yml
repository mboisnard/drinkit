# The lanes of ci.yml: a lane runs when a changed file matches one of its paths, and a changed file no list
# below matches runs every lane. No '!' pattern: it would match every other file

# Every lane lists the CI itself, so a change to it proves they all still run
ci: &ci
  - '.github/**'

backend: &backend
  - *ci
  - 'build-logic/**'
  - 'code-analysis/**'
  - 'gradle/**'
  - 'gradlew*'
  - 'gradle.properties'
  - '**/*.gradle.kts'
  - '**/*.lockfile'
  - 'drinkit/drinkit-api-contract/contract/**'
  - 'drinkit/drinkit-backend/src/**'
  - 'drinkit/drinkit-domain/src/**'
  - 'drinkit/drinkit-infra/src/**'
  - 'tech-starters/backend/*/src/**'
  - 'deployment/updater/src/**'

frontend: &frontend
  - *ci
  - '.nvmrc'
  - 'drinkit/drinkit-frontend/**'
  - 'drinkit/drinkit-api-contract/contract/**' # the TypeScript client is generated from it

docs: &docs
  - *ci
  - *backend # the domain and tech starter pages are generated from its sources
  - '.nvmrc'
  - 'docs/**'
  - 'tech-starters/backend/*/README.md' # copied into the tech starter pages

ops: &ops
  - *ci
  - 'deployment/local/**'

dependencies: &dependencies
  - *ci
  - '**/*.gradle.kts'
  - '**/*.lockfile'
  - 'gradle/**'
  - '**/package.json'
  - '**/package-lock.json'

# Files no job reads
none: &none
  - '**/*.md'
  - '.claude/**'
  - '.editorconfig'
  - '.githooks/**'
  - '.idea/**'
  - '.gitignore'
  - '.git-blame-ignore-revs'
  - 'LICENSE'

# ci.yml runs every lane when their counts differ
changed:
  - '**'
known:
  - *ci
  - *backend
  - *frontend
  - *docs
  - *ops
  - *dependencies
  - *none
