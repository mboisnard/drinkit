# The lanes of ci.yml: a lane runs when a changed file matches one of its paths, and a changed file no list
# below matches runs every lane. No '!' pattern: it would match every other file

workflows: &workflows
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/actionlint.yaml'

# The pnpm workspace that the frontend, the site and the hooks' tests install from
pnpm: &pnpm
  - '.nvmrc'
  - 'package.json'
  - 'pnpm-workspace.yaml'
  - 'pnpm-lock.yaml'

backend: &backend
  - *workflows
  - 'build-logic/**'
  - 'code-analysis/**'
  - 'gradle/**'
  - 'gradlew*'
  - 'gradle.properties'
  - '**/*.gradle.kts'
  - '**/*.lockfile'
  - 'drinkit/drinkit-api-contract/contract/**'
  - 'drinkit/drinkit-backend/src/**'
  - 'drinkit/drinkit-domain/src/**'
  - 'drinkit/drinkit-infra/src/**'
  - 'tech-starters/backend/*/src/**'
  - 'architecture-tests/src/**'

updater: &updater
  - *workflows
  - 'build-logic/**'
  - 'code-analysis/**'
  - 'gradle/**'
  - 'gradlew*'
  - 'gradle.properties'
  - '**/*.gradle.kts'
  - '**/*.lockfile'
  - 'deployment/updater/**'
  - 'deployment/local/compose.yml' # its PostgreSQL runs the image under test

frontend: &frontend
  - *workflows
  - *pnpm
  - '.browserslistrc'
  - 'code-analysis/eslint/**'
  - 'code-analysis/stylelint/**'
  - 'drinkit/drinkit-api-contract/contract/**' # each app generates its client from it at each build
  - 'drinkit/*-frontend/**'
  - 'tech-starters/frontend/**'

docs: &docs
  - *workflows
  - *backend # the domain and tech starter pages are generated from its sources
  - *pnpm
  - '.browserslistrc'
  - 'code-analysis/eslint/**' # the lint rules of the site
  - 'code-analysis/stylelint/**'
  - 'docs/**'
  - 'tech-starters/backend/*/README.md' # copied into the tech starter pages
  - '.claude/skills/**' # published by the site

hooks: &hooks
  - *workflows
  - *pnpm # bats comes from the workspace
  - '.hooks/**'
  - '.claude/**'

ops: &ops
  - *workflows
  - 'deployment/local/**'
  - 'deployment/updater/src/main/resources/db/**' # compose's updater applies them, with the demo data

renovate: &renovate
  - *workflows
  - '.github/renovate.json'

dependencies: &dependencies
  - *workflows
  - '**/*.gradle.kts'
  - '**/*.lockfile'
  - 'gradle/**'
  - *pnpm
  - '**/package.json'

# Files no job reads
none: &none
  - '**/*.md'
  - '.editorconfig'
  - '.idea/**'
  - '.gitignore'
  - '.git-blame-ignore-revs'
  - 'LICENSE'
  - '.github/ISSUE_TEMPLATE/**'
  - '.github/rulesets/**'

# ci.yml runs every lane when their counts differ
changed:
  - '**'
known:
  - *workflows
  - *pnpm
  - *backend
  - *updater
  - *frontend
  - *hooks
  - *docs
  - *ops
  - *renovate
  - *dependencies
  - *none
