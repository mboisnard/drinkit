name: Backend

on:
  workflow_call:
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: $/.github/actions/setup-gradle-jdk
        with:
          # The only job that saves the Gradle cache: it holds what the other Gradle jobs restore,
          # and a single writer keeps the cache within its 10 GB
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # One Gradle run: `check` already runs detekt on every module, detektAll adds the analysis of
      # the Gradle scripts at the root, --continue reports test and detekt failures together.
      # The updater lane runs Squawk, with Node
      - name: Build, test and analyse
        run: ./gradlew build detektAll --continue -x :updater:squawk

      - name: Publish the detekt findings
        if: (success() || failure()) && hashFiles('build/reports/detekt/detekt-all-projects.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: build/reports/detekt/detekt-all-projects.sarif
          category: detekt-code-analysis

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 7
