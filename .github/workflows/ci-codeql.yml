name: CodeQL

on:
  workflow_call:

jobs:
  analyse:
    name: Analyse the Kotlin and Java code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: $/.github/actions/setup-gradle-jdk

      # Compiled before CodeQL starts watching, the build conventions and their generated accessors
      # stay out of the database: about 70 s less, and only application code gets analysed
      - name: Compile the build logic
        run: ./gradlew help --no-daemon

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # CodeQL only extracts what it sees being compiled: a reused daemon or a build cache hit would hide
      # the compilation and leave the database empty
      - name: Build the application
        run: ./gradlew classes --no-daemon --no-build-cache

      - name: Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: codeql-security-analysis
