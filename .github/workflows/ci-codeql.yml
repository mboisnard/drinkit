name: CodeQL

on:
  workflow_call:
    inputs:
      kotlin:
        description: Analyse the backend, when the Backend lane runs
        type: boolean
        required: true
      typescript:
        description: Analyse the Nuxt apps, their starters and the site, when the Frontend lane runs
        type: boolean
        required: true

jobs:
  analyse:
    name: Analyse the Kotlin and Java code
    if: inputs.kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: $/.github/actions/setup-gradle-jdk

      # Compiled before CodeQL starts watching, the build conventions and their generated accessors
      # stay out of the database: about 70 s less, and only application code gets analysed
      - name: Compile the build logic
        run: ./gradlew help --no-daemon

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # CodeQL only extracts what it sees being compiled: a reused daemon or a build cache hit would hide
      # the compilation and leave the database empty
      - name: Build the application
        run: ./gradlew classes --no-daemon --no-build-cache

      - name: Analyse
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: codeql-security-analysis

  analyse-typescript:
    name: Analyse the TypeScript and Vue code
    if: inputs.typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL reads the sources as they are, .vue files included: no install, no build, and so no code that
      # Nuxt generates. The tests stay out, their doubles answer what a real backend never would
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/test/**'

      - name: Analyse
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: codeql-typescript
