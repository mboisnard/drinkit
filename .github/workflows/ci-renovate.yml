name: Renovate

on:
  workflow_call:

jobs:
  config:
    name: Validate the Renovate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This configuration decides what merges without a review
      - name: Validate the Renovate configuration
        uses: docker://ghcr.io/renovatebot/renovate:44.183.0@sha256:bc0efebde12e3cb457b6577348b7194d79dcfaa29e4fa6aacd4a1856e3540cbc
        with:
          args: renovate-config-validator --strict --no-global .github/renovate.json
