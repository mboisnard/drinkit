name: Renovate

on:
  workflow_call:

jobs:
  config:
    name: Validate the Renovate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This configuration decides what merges without a review
      - name: Validate the Renovate configuration
        uses: docker://ghcr.io/renovatebot/renovate:44.226.0@sha256:05b3a6b06d2c452e11bf0f3cd792f13d44d7e37b9a4bbd8106f6de6f5de4842b
        with:
          args: renovate-config-validator --strict --no-global .github/renovate.json
