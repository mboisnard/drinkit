name: Renovate

on:
  workflow_call:

jobs:
  config:
    name: Validate the Renovate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This configuration decides what merges without a review
      - name: Validate the Renovate configuration
        uses: docker://ghcr.io/renovatebot/renovate:45.3.2@sha256:d0358088501c7665688673c8932474b02517941703a16e970e8b4fcf235299cb
        with:
          args: renovate-config-validator --strict --no-global .github/renovate.json
