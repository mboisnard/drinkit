name: Renovate

on:
  workflow_call:

jobs:
  config:
    name: Validate the Renovate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This configuration decides what merges without a review
      - name: Validate the Renovate configuration
        uses: docker://ghcr.io/renovatebot/renovate:44.176.3@sha256:3b402971ebfcadc09473e684fb92caea52c0bfbbe78e3fd93f8e41d875999b0f
        with:
          args: renovate-config-validator --strict --no-global .github/renovate.json
